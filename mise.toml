[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.astro]
run = "astro"

[tasks.check]
depends = ["format-check", "type-check", "lint"]

[tasks.build]
depends = ["build-reviews"]
run = "astro build"

[tasks.build-reviews]
run = "node scripts/build-google-reviews.ts"

[tasks.clean]
run = "rm -fr .astro dist"

[tasks.dev]
depends = ["build-reviews"]
run = "astro dev"

[tasks.fallow]
depends = ["fallow-dead-code", "fallow-dupes"]

[tasks.fallow-dead-code]
run = "fallow dead-code"

[tasks.format-check]
run = "prettier --check astro.config.mjs eslint.config.mjs package.json scripts/. src/. tsconfig.json"

[tasks.fallow-dupes]
run = "fallow dupes"

[tasks.format]
run = "prettier --write astro.config.mjs eslint.config.mjs package.json scripts/. src/. tsconfig.json"

[tasks.install-deps]
run = "pnpm add --save-prod"

[tasks.install-dev-deps]
run = "pnpm add --save-dev"

[tasks.lint]
run = "biome lint astro.config.mjs eslint.config.mjs scripts/. src/. && eslint astro.config.mjs eslint.config.mjs scripts/. src/."

[tasks.lint-fix]
run = "biome lint astro.config.mjs eslint.config.mjs scripts/. src/. --fix && eslint astro.config.mjs eslint.config.mjs scripts/. src/. --fix"

[tasks.netlify]
run = "netlify"

[tasks.preview]
run = "astro preview"

[tasks.sort-package-json]
run = "sort-package-json"

[tasks.type-check]
run = "tsc --noEmit"

[tasks.uninstall-deps]
run = "pnpm remove"

[tasks.update-deps]
run = "pnpm update"

[tools]
node = "24.14.0"
